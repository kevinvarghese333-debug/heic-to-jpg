server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Streaming WebAssembly compilation refuses anything that is not
  # application/wasm, which would take the AI upscaler down with a type error.
  types {
    application/wasm   wasm;
    application/json   json webmanifest;
    text/javascript    js mjs;
  }
  default_type application/octet-stream;

  gzip on;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/wasm;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  # 'wasm-unsafe-eval' is what lets libheif and the ONNX runtime compile at all.
  # Everything else stays same-origin: there is nowhere for a photo to go.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'" always;

  # Content-addressed filenames, so they can never go stale.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location /ort/    { expires 1y; add_header Cache-Control "public, immutable"; }
  location /models/ { expires 30d; add_header Cache-Control "public"; }

  # The worker and the shell must never be pinned, or a deploy becomes
  # invisible to anyone who has already visited.
  location = /sw.js               { add_header Cache-Control "no-cache"; }
  location = /index.html          { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

  location / { try_files $uri $uri/ /index.html; }
}
