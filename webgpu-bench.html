<!doctype html><html><head><meta charset="utf-8"><title>bench2</title>
<style>body{font:13px ui-monospace,monospace;background:#111;color:#eee;padding:20px;line-height:1.6}</style></head>
<body><div id="log"></div><script type="module">
const log=m=>{const d=document.createElement('div');d.textContent=m;document.getElementById('log').append(d);console.log(m)};
window.__done=false;window.__r={};
try{
 const ad=await navigator.gpu.requestAdapter();
 const info=ad.info||await ad.requestAdapterInfo?.();
 log('GPU: '+JSON.stringify({vendor:info?.vendor,arch:info?.architecture,device:info?.device,desc:info?.description}));
 log('limits: maxBufferSize='+(ad.limits.maxBufferSize/1048576|0)+'MB maxStorageBuffer='+(ad.limits.maxStorageBufferBindingSize/1048576|0)+'MB');
 window.__r.gpu={vendor:info?.vendor,arch:info?.architecture,desc:info?.description};

 const ort=await import('onnxruntime-web/webgpu');
 ort.env.wasm.wasmPaths='/ort/'; ort.env.wasm.numThreads=1;

 const mk=(w,h)=>{const d=new Uint8ClampedArray(w*h*4);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const p=(y*w+x)*4;const v=110+60*Math.sin(x/w*Math.PI*9)*Math.cos(y/h*Math.PI*7);
  d[p]=v;d[p+1]=v*.85+20;d[p+2]=255-v;d[p+3]=255}return{data:d,width:w,height:h}};
 const toT=im=>{const pl=im.width*im.height,o=new Float32Array(pl*3);
  for(let p=0,i=0;p<pl;p++,i+=4){o[p]=im.data[i]/255;o[pl+p]=im.data[i+1]/255;o[2*pl+p]=im.data[i+2]/255}return o};

 for(const [name,url,tile] of [['RealPLKSR x2 (28MB)','/models/realplksr_x2.onnx',512],
                               ['ClearReality x4 (1.8MB)','/models/clearreality_x4.onnx',512],
                               ['ClearReality x4 (1.8MB)','/models/clearreality_x4.onnx',256]]){
  try{
   const s=await ort.InferenceSession.create(url,{executionProviders:['webgpu'],graphOptimizationLevel:'all'});
   const img=mk(tile,tile);
   const feed=()=>({[s.inputNames[0]]:new ort.Tensor('float32',toT(img),[1,3,tile,tile])});
   await s.run(feed()); // warm-up: compiles shaders
   const N=3; const t0=performance.now();
   for(let i=0;i<N;i++) await s.run(feed());
   const per=(performance.now()-t0)/N;
   log(`${name} @${tile}px tile: ${(per/1000).toFixed(2)}s/tile`);
   const mpPerTile=(tile*tile)/1e6;
   log(`   -> ${(per/1000/mpPerTile).toFixed(1)}s per input MP | 1MP img ~${(per/1000/mpPerTile).toFixed(0)}s | 12MP ~${(per/1000/mpPerTile*12/60).toFixed(1)}min`);
   window.__r[name+'@'+tile]=per;
   await s.release();
  }catch(e){log(name+' @'+tile+' FAILED: '+e.message.slice(0,120))}
 }
}catch(e){log('ERR '+e.message);window.__r.error=e.message}
window.__done=true;
</script></body></html>
